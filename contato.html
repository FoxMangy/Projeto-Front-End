<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <title>Parada Certa - Contato</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="icon"  href="imagens/icones/fritas.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            h1 {
                text-align: center;
                color: #F3E2C4;
                font-size:60px;
                font-family:'hakuna', sans-serif;
            }

            h2 {
                text-align: center;
                color: #F3E2C4;
                font-size:30px;
                font-family:'hakuna', sans-serif;
            }

            p {
                text-align: center;
                color: #F3E2C4;
                font-size:22px;
            }

            nav {
                text-align: center;
                color: #F3E2C4;
            }

            h3 {
                text-align: center;
                color: #F3E2C4;
                font-size:25px;
            }

            .container {
                max-width: 1200px;
                margin: 40px auto;
                padding: 0 150px;
            }

            .titulo-contato {
                text-align: center;
                margin-bottom: 50px;
            }

            .conteudo-contato {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 20px;
            }

            .informacoes {
                flex: 1;
                margin-top: 15px;
            }

            .formulario {
                width: 100%;
                max-width: 401px;
                border: 4px solid #45271a67;
                border-radius: 20px;
                background-color: #251b10bb;
                padding: 10px;
                box-shadow: 0 8px 30px rgba(0,0,0,.4);
            }

            form {
                display:flex;
                flex-direction: column;
                align-items: center;
            }

            .formulario input {
                max-width:90%;
            }

            .formulario textarea {
                max-width:90%;
                height:200px;
            }

            form input{
                padding: 8px;
                width: 100%;
                margin-bottom: 8px;
                border: 1px solid transparent;
                background-color: #f3e2c4;
            }

            textarea {
                width: 100%;
                resize: none;
                padding: 8px;
                border: 1px solid transparent;
                background-color: #F3E2C4;
            }

            .submit {
                padding: 8px;
                border: 1px solid transparent;
                margin-top: 8px;
                background-color: #F3E2C4;
                font-size: 16px;
                font-weight: bold;
            }

        </style>
        <link rel="stylesheet" href="css/mobile.css">
    </head>

 <body>

        <!-- Menu de Navegação-->
         <header id="main_menu">
             <img src="imagens/icones/logo_no_bg.png" alt="Logo Principal" class="main_logo">
             <nav>
                 <ul>
                     <li><a href="index.html">Página Inicial</a></li>
                     <li><a href="sobre_nos.html">Sobre Nós</a></li>
                     <li><a href="produtos.html">Produtos</a></li>
                     <li><a href="novidades.html">Novidades</a></li>
                     <li><a href="contato.html" class="ativo">Contato</a></li>
                </ul>
                <button class="botao_seta" id="botao_menu">▼</button>
            </nav>
        </header>

            <main class="container">

                <section class="titulo-contato">
                    <h2>FICOU COM ALGUMA DÚVIDA?</h2>
                    <p>Entre em contato preenchendo o formulário e nossa equipe o ajudará.</p>
                </section>

                <div class="conteudo-contato">

                    <section class="informacoes">
                        
                        <h3>INFORMAÇÕES</h3>
                        <p><strong>Endereço: </strong>Rua dos Burgues 123 <br>Centro</p><br>
                        <p><strong>Telefone: </strong>(21) 99999-9999</p><br>
                        <p><strong>E-mail: </strong>contato@paradacerta.com.br</p><br>
                        
                    </section>
                    
                    <div class="formulario">

                        <h1>Fale conosco</h1>
                        <form id="form">
                            <input type="text" id="name" placeholder="Nome">
                            <input type="email" id="email" placeholder="E-mail">
                            <textarea id="message" rows="5" placeholder="Mensagem"></textarea>
                            <button class ="submit" type="submit">Enviar</button>
                        </form>
                    </div>

                </div>

            </main>

        <script src="js/menu_mobile.js">
            //Script de menu retrátil no mobile
        </script>

        <script src="js/formulario.js">
            //Script para validação do formulário
        </script>
    </body>
</html>
